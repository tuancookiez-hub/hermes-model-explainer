name: model-explainer
version: "0.5.0"
description: "Hermes Desktop page, and a pop-up beside the chat model pill, built around your model picker: choose a model to see its Hermes Index score, cost per task, context and output limits, price, abilities and your own measured speed and spend, or compare up to four side by side, then switch your chat to it with Use this model (the same config.set request as the built-in picker, never without a click). Every value cites a source and date. Network: one GET of a public JSON data file on GitHub, at most daily and only when the page or pop-up opens; it can be turned off, and the bundled copy works offline. Desktop-only (desktop/plugin.js inside the plugin SDK surface); no agent tools, hooks, middleware or env vars."
author: tuancookiez-hub
homepage: https://github.com/tuancookiez-hub/hermes-model-explainer
license: MIT
requires_hermes: ">=0.23.0"
provides_tools: []
provides_hooks: []
provides_middleware: []
requires_env: []
capabilities: []
tags: [desktop, models, benchmarks]
